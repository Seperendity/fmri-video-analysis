[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-video-analysis"
version = "0.2.0"
description = "Four-session natural-video fMRI analysis pipelines"
requires-python = ">=3.9"
dependencies = [
  "matplotlib",
  "networkx",
  "nibabel",
  "nilearn",
  "numpy",
  "pandas",
  "pillow",
  "scikit-learn",
  "scipy",
  "umap-learn",
  "xgboost",
]

[project.optional-dependencies]
detection = ["torch", "torchvision"]
visualization = ["pycortex"]
analysis = [
  "opencv-python-headless",
  "pingouin",
  "scikit-image",
  "seaborn",
  "statsmodels",
  "tqdm",
]
dev = ["pytest", "pytest-cov", "ruff"]
full = [
  "opencv-python-headless",
  "pingouin",
  "pycortex",
  "pytest",
  "pytest-cov",
  "ruff",
  "scikit-image",
  "seaborn",
  "statsmodels",
  "torch",
  "torchvision",
  "tqdm",
]

[project.scripts]
fmri-video = "fmri_video_analysis.cli:main"
fmri-video-preflight = "fmri_video_analysis.cli:preflight_main"
fmri-video-pilot = "fmri_video_analysis.cli:pilot_main"
fmri-video-reproduce = "fmri_video_analysis.cli:reproduce_main"
fmri-video-revision = "fmri_video_analysis.pipelines.revision:main"
fmri-video-original-mvpa = "fmri_video_analysis.pipelines.original_mvpa:main"
fmri-video-background-fc = "fmri_video_analysis.pipelines.background_fc:main"
fmri-video-group-fc = "fmri_video_analysis.pipelines.group_fc:main"
fmri-video-sensitivity-fc = "fmri_video_analysis.pipelines.sensitivity_fc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
